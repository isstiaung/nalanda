version: 2

# Deliberately quiet, but majors arrive alone. Grouping *everything* once produced a
# single PR carrying TypeScript 5→7, Vitest 3→4, workers-types 4→5 and
# vitest-pool-workers 0.8→0.20 together — unreviewable, and each needed its own
# migration. Minor and patch bumps still batch into one monthly PR; anything major
# is left ungrouped so it opens its own PR against its own migration notes.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Direct dependencies only. Dependabot kept failing the whole run trying to bump
    # `vite`, a transitive dep of vitest whose peer range it cannot satisfy — and a
    # dependency we do not declare is not ours to pin. Transitive packages are still
    # covered by Dependabot *security* updates, which are a separate mechanism.
    allow:
      - dependency-type: direct
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
