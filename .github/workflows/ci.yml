name: CI

# Deliberately reachable by fork pull requests, and deliberately powerless.
#
# `pull_request` (never `pull_request_target`) runs the merge commit with a
# read-only GITHUB_TOKEN and no access to repository secrets, so a PR cannot
# reach Cloudflare no matter what it changes. This workflow needs no
# credentials: it type-checks, lints for accessibility, runs the test suite (a local
# D1 in the real Workers runtime) and runs the accessibility audit (a scratch
# `wrangler dev` on the runner, seeded offline, driven by Playwright's Chromium).
# Deploys happen elsewhere — see runbooks/deploy.md — and nothing here should ever
# be given a deploy token.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # this repository's checks: a copy made with the Deploy to Cloudflare button carries this file too, and a
    # household's own copy holds its own database id (§16 #101). A pull request from a fork still runs: for
    # pull_request, github.repository is this one.
    if: github.repository == 'isstiaung/nalanda'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11, which writes package-lock.json (locally and for Dependabot).
          # Node 22's npm 10 rejects its optional-dependency layout ("Missing @esbuild/… from
          # lock file"), and upgrading npm on the runner could hang on the registry.
          node-version: 24
          cache: npm

      # postinstall vendors htmx, the ZXing WASM and the fonts into public/vendor/; retried, as in a11y
      - name: npm ci
        run: for i in 1 2 3; do timeout 180 npm ci && exit 0; echo "npm ci attempt $i didn't finish; retrying"; done; exit 1

      - run: npm run typecheck

      # this repository names no Cloudflare resource (ARCH.md §16 #24): its database_id is the all-zero placeholder,
      # which the Deploy button overwrites in a household's own copy (§16 #101) — so the check is here, not in the tests
      - name: wrangler.jsonc keeps the placeholder database id
        run: |
          grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' wrangler.jsonc

      # eslint-plugin-jsx-a11y only: the static half of the accessibility audit (ARCH.md §18)
      - run: npm run lint

      # vitest-pool-workers boots workerd and applies migrations/ to a fresh D1
      - run: npm test

  # The runtime half (ARCH.md §18): axe-core on every page, both themes, desktop and phone
  # widths. Its own job so a slow browser run never holds up the type-check and tests. It
  # starts `wrangler dev` on 127.0.0.1:8817 with a throwaway state directory and a
  # throwaway session secret and connections key it makes itself — no secrets from here.
  a11y:
    name: a11y (${{ matrix.variant }})
    if: github.repository == 'isstiaung/nalanda'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # every variant reports, even when one fails
      fail-fast: false
      matrix:
        variant: ['light 1280', 'dark 1280', 'light 390', 'dark 390']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11, which writes package-lock.json; see the check job
          node-version: 24
          cache: npm

      # the registry has hung this step on a runner; give up after 3 minutes and try again
      - name: npm ci
        run: for i in 1 2 3; do timeout 180 npm ci && exit 0; echo "npm ci attempt $i didn't finish; retrying"; done; exit 1

      # Chromium's headless shell, kept between runs for this Playwright version; the system
      # libraries it needs are installed every time (they live outside the cache)
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run a11y
        env:
          A11Y_VARIANT: ${{ matrix.variant }}
