name: Release

# Publishes a GitHub Release when a version tag is pushed, with that version's file, changelog/vX.Y.Z.md, as
# its notes. GitHub runs this file as it is in the tagged commit, so it only fires for tags on commits that
# carry it: v1.0.0, tagged after the fact on a commit from before it existed, was published by hand. It never deploys: deploys happen elsewhere (runbooks/deploy.md), and nothing here should ever
# be given a deploy token. The only credential is the job's own GITHUB_TOKEN, allowed to write releases.
# Only people with push access can push a tag, so a fork's pull request can't start this.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the notes come from main's changelog/, which holds a file for every release
          persist-credentials: false # gh takes its token from GH_TOKEN; nothing else needs it

      # A release is a commit on main. A version tag pushed anywhere else would otherwise publish main's notes
      # against a commit that never shipped.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      # A tag from before versioning began (v1.0.0) has no version in package.json; every later one must match.
      - name: Check the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version || ''")"
          if [ -n "$declared" ] && [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but package.json says $declared"
            exit 1
          fi

      # A release commit renames changelog/unreleased.md to changelog/vX.Y.Z.md, headed "## [X.Y.Z] - date".
      # The notes are that file without its heading line and without link definitions ("[1.3.0]: https://…").
      - name: Take this version's notes from changelog/
        run: |
          version="${GITHUB_REF_NAME#v}"
          file="changelog/v$version.md"
          if ! git cat-file -e "origin/main:$file" 2>/dev/null; then
            echo "::error::main has no $file (a release commit renames changelog/unreleased.md to it)"
            exit 1
          fi
          git show "origin/main:$file" > release.md
          heading="$(head -n 1 release.md)"
          case "$heading" in
            "## [$version] - "*) ;;
            *)
              echo "::error::$file must start with \"## [$version] - <date>\", not \"$heading\""
              exit 1
              ;;
          esac
          awk 'NR > 1 && !/^\[[0-9]+\.[0-9]+\.[0-9]+\]: /' release.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::$file on main has a heading but no notes"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Nalanda $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
